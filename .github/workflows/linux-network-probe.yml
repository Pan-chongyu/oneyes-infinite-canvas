name: Linux tooling network probe
on:
  push:
    branches: [codex/smart-video-edit]
    paths: [.github/workflows/linux-network-probe.yml, .github/actions/linux-network/action.yml]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/linux-network
      - name: Install tooling from signed official Ubuntu repositories
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff libfuse2t64
