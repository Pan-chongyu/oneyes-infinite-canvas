name: Linux tooling network probe
on:
  push:
    branches: [codex/smart-video-edit]
    paths: [.github/workflows/linux-network-probe.yml]
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect official Ubuntu DNS and recover the ephemeral runner
        shell: bash
        run: |
          resolvectl status
          if ! getent ahostsv4 security.ubuntu.com; then
            interface=$(ip -j route get 1.1.1.1 | jq -r '.[0].dev')
            sudo resolvectl dns "$interface" 1.1.1.1 1.0.0.1
            sudo resolvectl flush-caches
          fi
          getent ahostsv4 security.ubuntu.com
          getent ahostsv4 azure.archive.ubuntu.com
          sudo apt-get update -qq
          sudo apt-get install -y bsdiff libfuse2t64
