name: OneYes Canvas Desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows_icons_only:
        description: Run only the native Windows installer and shortcut regression
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: canvas-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-icons:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_icons_only
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/build-resource-relay.mjs start "${{ runner.temp }}/canvas-build-relay.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: node --test test/windows-update.test.mjs
      - run: npm run test:ota-package
      - if: always()
        run: node scripts/build-resource-relay.mjs stop "${{ runner.temp }}/canvas-build-relay.json"
  ota-base:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: Pin the signed previous release for every delta task
        run: node scripts/prepare-ota-base.mjs release-base --manifest-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: Canvas-OTA-Base
          path: release-base/*
          if-no-files-found: error
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_icons_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            arch: x64
            target: win
          - os: windows-11-arm
            platform: Windows
            arch: arm64
            target: win
          - os: macos-15-intel
            platform: macOS
            arch: x64
            target: mac
          - os: xcode-27
            platform: macOS
            arch: arm64
            target: mac
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
            target: linux
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
            target: linux
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            canvas-agent/package-lock.json
            vendor/velocut/web/package-lock.json
      - name: Prepare official Ubuntu tooling DNS
        if: matrix.target == 'linux'
        uses: ./.github/actions/linux-network
      - name: Install Linux packaging tools
        if: matrix.target == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm libfuse2t64 xvfb
      - name: Resolve Electron and packaging tools through the official asset API
        run: node scripts/build-resource-relay.mjs start "${{ runner.temp }}/canvas-build-relay.json"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm ci --prefix canvas-agent --include=optional
      - run: npm ci --prefix vendor/velocut/web --ignore-scripts
      - run: npm run build:editor
      - run: npm run typecheck:editor
      - run: npm run test:editor
      - name: Prepare checksum-pinned native media tools
        run: npm run media:prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm --prefix canvas-agent test
      - name: Validate version and architecture
        shell: bash
        run: |
          node -e "const fs=require('fs'),p=require('./package.json');if(fs.readFileSync('VERSION','utf8').trim()!=='v'+p.version||process.arch!=='${{ matrix.arch }}')process.exit(1)"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then test "$GITHUB_REF_NAME" = "$(cat VERSION)"; fi
      - run: npm test
      - run: npm run test:chat
      - run: npm run test:models
      - run: npm run test:ota-ui
      - name: Verify small edits produce small native Windows downloads
        if: matrix.target == 'win'
        run: npm run test:ota-package
      - run: npm run test:videos
      - run: npm run test:video-workflow
      - run: npm run test:playback
      - run: npm run test:images
      - run: npm run test:image-details
      - run: npm run test:plugins
      - run: npm run test:webdav
      - run: npm run test:creators
      - run: npm run test:director
      - run: npm run test:studio
      - run: npm run test:collaboration
      - run: npm run test:smart-edit
      - run: npm --prefix web run typecheck
      - run: npm run build
      - run: npm run test:codec
      - run: npm run test:creator-codec
      - name: Verify automatic Windows-MCP dependency setup
        if: matrix.target == 'win'
        run: node scripts/smoke-windows-mcp.mjs
      - name: Package desktop installers
        run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate signed-feed block map inputs for every OTA format
        run: node scripts/prepare-ota-blockmaps.mjs desktop-dist
      - name: Smoke test Windows package
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $app = Get-ChildItem desktop-dist -Filter 'OneYes Canvas.exe' -Recurse | Select-Object -First 1
          $run = Start-Process -FilePath $app.FullName -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw 'Windows desktop startup failed' }
      - name: Smoke test macOS package
        if: matrix.target == 'mac'
        shell: bash
        run: |
          app=$(find desktop-dist -path '*/Contents/MacOS/OneYes Canvas' -type f | head -n 1)
          codesign --verify --deep --strict "$(dirname "$(dirname "$(dirname "$app")")")"
          "$app" --smoke-test
      - name: Smoke test Linux package
        if: matrix.target == 'linux'
        shell: bash
        run: |
          app=$(find desktop-dist -name oneyes-canvas -type f | head -n 1)
          xvfb-run -a "$app" --no-sandbox --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: OneYes-Canvas-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop-dist/*.exe
            desktop-dist/*.blockmap
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.AppImage
            desktop-dist/*.deb
            desktop-dist/*.rpm
          if-no-files-found: error
      - name: Stop build resource relay
        if: always()
        continue-on-error: true
        run: node scripts/build-resource-relay.mjs stop "${{ runner.temp }}/canvas-build-relay.json"
  delta:
    if: github.ref_type == 'tag'
    needs: [build, ota-base]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-nsis
            installer: Windows-x64
          - target: win32-arm64-nsis
            installer: Windows-arm64
          - target: darwin-x64-zip
            installer: macOS-x64
          - target: darwin-arm64-zip
            installer: macOS-arm64
          - target: linux-x64-AppImage
            installer: Linux-x64
          - target: linux-x64-deb
            installer: Linux-x64
          - target: linux-x64-rpm
            installer: Linux-x64
          - target: linux-arm64-AppImage
            installer: Linux-arm64
          - target: linux-arm64-deb
            installer: Linux-arm64
          - target: linux-arm64-rpm
            installer: Linux-arm64
    name: Delta ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: OneYes-Canvas-${{ matrix.installer }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Canvas-OTA-Base
          path: release-base
      - name: Download only this target's signed base
        run: node scripts/prepare-ota-base.mjs release-base --pinned --target=${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reconstruct this target using only changed blocks
        run: node scripts/verify-block-update.mjs ${{ matrix.target }} release release-base
      - uses: actions/upload-artifact@v4
        with:
          name: Canvas-OTA-Delta-${{ matrix.target }}
          path: release/OTA-BLOCKS-*.json
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: [build, ota-base, delta]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install manifest validation dependencies
        run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: OneYes-Canvas-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: Canvas-OTA-Delta-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: Canvas-OTA-Base
          path: release-base
      - name: Verify the pinned base manifest without downloading installers again
        run: node scripts/prepare-ota-base.mjs release-base --pinned --manifest-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify every platform and generate checksums
        env:
          CANVAS_OTA_PRIVATE_KEY: ${{ secrets.CANVAS_OTA_PRIVATE_KEY }}
          CANVAS_OTA_BASE_DIR: ${{ github.workspace }}/release-base
          CANVAS_OTA_BLOCKMAP_REPORTS: '1'
        run: node scripts/verify-desktop-release.mjs release
      - name: Publish public desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "OneYes Canvas $GITHUB_REF_NAME · Windows / macOS / Linux" --notes-file docs/DESKTOP_RELEASE.md --latest
